plugins {
    id 'com.android.application'
}
android {
    namespace 'com.orderproject.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.orderproject.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "22.3"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
}
